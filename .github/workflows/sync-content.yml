name: Sync Obsidian Content

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CONTENT_SYNC_PAT }}
          persist-credentials: true

      - name: Configure git credentials for submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.CONTENT_SYNC_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Init and update submodules
        run: |
          git submodule sync
          git submodule update --init --remote --merge content

      - name: Commit and push if updated
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@pgd618.studio"
          git add content
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync Obsidian content to latest"
            git push
          fi
