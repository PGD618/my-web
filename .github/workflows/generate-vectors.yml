name: Generate Vectors

on:
  # 每周日凌晨 2:00（北京时间）自动更新向量
  schedule:
    - cron: '0 18 * * 6'  # UTC 周六 18:00 = 北京时间周日 02:00
  # 支持手动触发（需要立即更新时使用）
  workflow_dispatch:

jobs:
  build-vectors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Clean up nested submodule artifacts
        run: |
          # 清理可能的嵌套子模块残留配置
          find content -name ".git" -type f -delete || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Generate vectors
        env:
          ALIBABA_EMBEDDING_API_KEY: ${{ secrets.ALIBABA_EMBEDDING_API_KEY }}
        run: node scripts/build-vectors.mjs

      - name: Upload to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          # 安装 COS CLI
          pip install coscmd

          # 配置 COS CLI
          coscmd config -a $COS_SECRET_ID -s $COS_SECRET_KEY -b $COS_BUCKET -r $COS_REGION

          # 上传到 COS（增加超时时间和分片上传）
          coscmd upload -r ./vectors/ /vectors/ --ignore "*.git*" || {
            echo "First upload attempt failed, retrying with slower speed..."
            coscmd upload ./vectors/vectors.json /vectors/vectors.json
          }

      - name: Summary
        run: |
          echo "✅ Vectors generated and uploaded to Tencent Cloud COS"
          echo "📊 Files processed: $(cat vectors/vectors.json | grep -o '"id"' | wc -l)"
